server:
  port: 8080

spring:
  application:
    name: sitesync-backend

  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      # Camera photos can easily exceed Spring's default 1MB limit —
      # sized generously since image_picker on the Flutter side doesn't
      # compress by default.
      max-file-size: 15MB
      max-request-size: 15MB

supabase:
  storage: 
    endpoint: ${SUPABASE_STORAGE_ENDPOINT}
    region: us-east-1
    access-key: ${SUPABASE_STORAGE_ACCESS_KEY}
    secret-key: ${SUPABASE_STORAGE_SECRET_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:sitesync-media}
    public-base-url: ${SUPABASE_STORAGE_PUBLIC_BASE_URL}

app:
  mail:
    from: ${GMAIL_ADDRESS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 45
  otp:
    expiry-minutes: 10
    length: 6
  firebase:
    service-account-path: sitesync-firebase-adminsdk.json

# ---------------------------------------------------------------------
# Environment variables required before this application will start:
#
#   SUPABASE_DB_HOST       - Supabase SESSION POOLER host (not direct connection).
#                            Dashboard: Project Settings -> Database -> Connection Pooling
#                            -> "Session pooler" tab. Looks like:
#                            aws-0-<region>.pooler.supabase.com
#                            (Direct connection is IPv6-only unless you pay for the
#                            IPv4 add-on, which causes "Connect timed out" errors on
#                            most home/office networks — the pooler avoids this.)
#   SUPABASE_DB_USER       - pooler username, format: postgres.<project-ref>
#                            e.g. postgres.tbeayjpuutjfneqnmmmm
#                            (shown on the same "Session pooler" tab)
#   SUPABASE_DB_PASSWORD   - the password you set when creating the Supabase project
#   JWT_SECRET             - generate with: openssl rand -base64 64
#   GMAIL_ADDRESS          - the Gmail account sending OTP emails
#   GMAIL_APP_PASSWORD     - a Gmail "App Password" (NOT your login password -
#                            Google Account -> Security -> 2-Step Verification
#                            (enable if not already) -> App Passwords -> generate one)
#
# Local development (PowerShell): set each variable in your terminal before
# running the app, e.g.:
#
#   $env:SUPABASE_DB_HOST="aws-0-<region>.pooler.supabase.com"
#   $env:SUPABASE_DB_USER="postgres.xxxxx......"
#   $env:SUPABASE_DB_PASSWORD="your-password"
#   $env:JWT_SECRET="your-jwt-secret"
#   $env:GMAIL_ADDRESS="your-gmail"
#   $env:GMAIL_APP_PASSWORD="your-app-password"
#
# These only last for the current terminal session — re-set them each time
# you open a new terminal, or use a .env file with spring-dotenv / the
# IntelliJ "EnvFile" plugin to avoid retyping them.
# ---------------------------------------------------------------------