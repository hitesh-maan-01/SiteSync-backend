server:
  port: 8080

spring:
  application:
    name: sitesync-backend

  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres
    username: postgres
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      # Camera photos can easily exceed Spring's default 1MB limit —
      # sized generously since image_picker on the Flutter side doesn't
      # compress by default.
      max-file-size: 15MB
      max-request-size: 15MB

app:
  storage:
    upload-dir: ./uploads
    # Must match wherever this Spring Boot instance is actually reachable
    # from the Flutter app — same host:port as app_config.dart's
    # _devBaseUrl for local dev (http://10.0.2.2:8080 on the Android
    # emulator's side, but the SERVER's own view of itself is just
    # localhost:8080 — set this to whatever the server should embed in
    # photo URLs it hands back).
    public-base-url: http://localhost:8080
  mail:
    from: ${GMAIL_ADDRESS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30
  otp:
    expiry-minutes: 10
    length: 6

# ---------------------------------------------------------------------
# Environment variables required before this application will start:
#
#   SUPABASE_DB_HOST       - from Supabase dashboard: Project Settings -> Database
#   SUPABASE_DB_PASSWORD   - the password you set when creating the Supabase project
#   JWT_SECRET             - generate with: openssl rand -base64 64
#   GMAIL_ADDRESS          - the Gmail account sending OTP emails
#   GMAIL_APP_PASSWORD     - a Gmail "App Password" (NOT your login password -
#                            Google Account -> Security -> 2-Step Verification
#                            (enable if not already) -> App Passwords -> generate one)
#
# Local development: create a .env file (add it to .gitignore - never
# commit real secrets) and either export each line manually, or use
# something like the "EnvFile" run configuration in IntelliJ, or
# spring-dotenv as a dependency if you want automatic .env loading.
# ---------------------------------------------------------------------